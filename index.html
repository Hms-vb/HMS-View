/* ---------- Series ---------- */
function obterEpisodiosTemporada(numeroTemporada) {
  if (!currentEpisodesData || typeof currentEpisodesData !== "object") return [];
  const chaveString = String(numeroTemporada);
  let episodios = currentEpisodesData[chaveString];
  if (!Array.isArray(episodios)) episodios = currentEpisodesData[Number(numeroTemporada)];
  if (!Array.isArray(episodios)) episodios = currentEpisodesData[chaveString + ".0"];
  return normalizarLista(episodios).slice().sort(function (a, b) {
    const numeroA = Number(a.episode_num);
    const numeroB = Number(b.episode_num);
    if (Number.isFinite(numeroA) && Number.isFinite(numeroB)) return numeroA - numeroB;
    if (Number.isFinite(numeroA)) return -1;
    if (Number.isFinite(numeroB)) return 1;
    return 0;
  });
}

function atualizarDescricaoSerie(plot) {
  if (!plot) return;
  const wrap = $("#descricaoWrap");
  const texto = $("#descricaoConteudo");
  if (wrap) wrap.classList.remove("hidden");
  if (texto) texto.textContent = plot;
}

function montarTemporadas(dados) {
  const mapa = new Map();
  normalizarLista(dados && dados.seasons).forEach(function (temporada) {
    if (!temporada) return;
    const numero = Number(
      temporada.season_number != null ? temporada.season_number
        : (temporada.season != null ? temporada.season : temporada.id)
    );
    if (!Number.isFinite(numero)) return;
    mapa.set(numero, Object.assign({}, temporada, {
      season_number: numero,
      name: temporada.name || temporada.season_name || ("Temporada " + numero)
    }));
  });

  const numerosEpisodios = Object.keys(currentEpisodesData || {})
    .filter(function (chave) {
      return Array.isArray(currentEpisodesData[chave]) && currentEpisodesData[chave].length > 0;
    })
    .map(Number)
    .filter(function (numero) { return Number.isFinite(numero); });

  numerosEpisodios.forEach(function (numero) {
    if (!mapa.has(numero)) {
      mapa.set(numero, { season_number: numero, name: "Temporada " + numero });
    }
  });

  return Array.from(mapa.values()).sort(function (a, b) {
    return Number(a.season_number) - Number(b.season_number);
  });
}

function renderizarEpisodios(numeroTemporada) {
  const grade = $("#episodesGrid");
  if (!grade) return;
  grade.innerHTML = "";
  const episodios = obterEpisodiosTemporada(numeroTemporada);
  if (!episodios.length) {
    const aviso = document.createElement("div");
    aviso.className = "serie-message";
    aviso.innerHTML = "<strong>Nenhum episódio nesta temporada</strong>Escolha outra temporada no seletor acima.";
    grade.appendChild(aviso);
    return;
  }

  episodios.forEach(function (episodio, indice) {
    const numero = episodio.episode_num != null ? episodio.episode_num : indice + 1;
    const titulo = episodio.title || episodio.name || ("Episódio " + numero);
    const info = episodio.info && typeof episodio.info === "object" ? episodio.info : {};
    const imagemEpisodio = valorImagem(info.movie_image) || valorImagem(info.cover_big) || valorImagem(info.cover) || valorImagem(currentItem && currentItem.cover);
    const idEpisodio = String(episodio.id != null ? episodio.id : (episodio.episode_id != null ? episodio.episode_id : ""));

    const card = document.createElement("button");
    card.type = "button";
    card.className = "episode-card";
    card.dataset.episodeKey = idEpisodio || (numeroTemporada + "-" + indice);
    if (currentEpisode && String(currentEpisode.id != null ? currentEpisode.id : currentEpisode.episode_id) === idEpisodio) {
      card.classList.add("ativo");
    }
    card.setAttribute("aria-label", "Assistir temporada " + numeroTemporada + ", episódio " + numero + ": " + titulo);

    const thumb = document.createElement("div");
    thumb.className = "episode-thumb";
    if (imagemEpisodio) {
      thumb.classList.add("tem-foto");
      const img = document.createElement("img");
      img.src = imagemEpisodio;
      prepararImagem(img, "");
      thumb.appendChild(img);
    }
    const numeroEl = document.createElement("span");
    numeroEl.className = "ep-num";
    numeroEl.textContent = "EP " + numero;
    thumb.appendChild(numeroEl);

    const infoEl = document.createElement("div");
    infoEl.className = "episode-info";
    const rotulo = document.createElement("span");
    rotulo.className = "episode-label";
    rotulo.textContent = "T" + numeroTemporada + " • EPISÓDIO " + numero;
    const tituloEl = document.createElement("span");
    tituloEl.className = "episode-title";
    tituloEl.textContent = titulo;
    const duracao = info.duration || episodio.duration || "";
    infoEl.appendChild(rotulo);
    infoEl.appendChild(tituloEl);
    if (duracao) {
      const duracaoEl = document.createElement("span");
      duracaoEl.className = "episode-duration";
      duracaoEl.textContent = duracao;
      infoEl.appendChild(duracaoEl);
    }

    card.appendChild(thumb);
    card.appendChild(infoEl);
    card.addEventListener("click", function () {
      reproduzirEpisodio(numeroTemporada, indice, true);
    });
    grade.appendChild(card);
  });
}

function mudarTemporada(valor) {
  const numero = Number(valor);
  if (!Number.isFinite(numero)) return;
  renderizarEpisodios(numero);
}

function reproduzirEpisodio(numeroTemporada, indice, rolar) {
  const episodios = obterEpisodiosTemporada(numeroTemporada);
  const episodio = episodios[indice];
  if (!episodio) return;
  const idEpisodio = episodio.id != null ? episodio.id : episodio.episode_id;
  if (idEpisodio == null) {
    exibirToast("Este episódio não possui um stream válido.");
    return;
  }
  const numero = episodio.episode_num != null ? episodio.episode_num : indice + 1;
  const titulo = episodio.title || episodio.name || ("Episódio " + numero);
  currentEpisode = episodio;
  const stream = urlDoEpisodio(episodio);
  definirStream(stream, "serie");

  const atual = $("#episodioAtual");
  if (atual) {
    atual.textContent = "T" + numeroTemporada + " • E" + numero + " — " + titulo;
    atual.classList.remove("hidden");
  }
  $$(".episode-card").forEach(function (card) {
    card.classList.toggle("ativo", card.dataset.episodeKey === String(idEpisodio));
  });
  if (currentSerieName) document.title = currentSerieName + " • T" + numeroTemporada + "E" + numero + " — HMS-TV";

  if (currentItem) {
    const registro = Object.assign({}, currentItem, {
      tipo: "serie",
      ultimoEpisodio: {
        temporada: numeroTemporada,
        episodio: numero,
        titulo: titulo,
        id: idEpisodio
      }
    });
    salvarAssistido(registro);
  }

  if (rolar) {
    const shell = $("#playerShell");
    if (shell) shell.scrollIntoView({ behavior: "smooth", block: "center" });
  }
}

async function carregarSerieDetalhes(item) {
  const area = $("#serieArea");
  if (!area) return;
  const serieId = item.series_id != null ? item.series_id : item.id;
  currentSerieId = serieId;
  currentSerieName = String(item.name || "Série");
  currentEpisodesData = {};
  currentSeasons = [];
  currentEpisode = null;

  try {
    const dados = await fetchJson(apiUrl("get_series_info", { series_id: serieId }));
    if (!area || !document.body.contains(area) || currentTipo !== "serie" || String(currentSerieId) !== String(serieId)) return;
    if (!dados || typeof dados !== "object") throw new Error("Sem dados");

    if (Array.isArray(dados.episodes)) {
      currentEpisodesData = { 1: dados.episodes };
    } else if (dados.episodes && typeof dados.episodes === "object") {
      currentEpisodesData = dados.episodes;
    } else {
      currentEpisodesData = {};
    }

    const info = dados.info && typeof dados.info === "object" ? dados.info : {};
    atualizarDescricaoSerie(info.plot || info.description || item.plot || "");
    currentSeasons = montarTemporadas(dados);

    let totalEpisodios = 0;
    currentSeasons.forEach(function (temporada) {
      totalEpisodios += obterEpisodiosTemporada(temporada.season_number).length;
    });

    if (!totalEpisodios) {
      area.innerHTML =
        '<div class="serie-message"><strong>Série sem episódios disponíveis</strong>' +
        'Não encontramos episódios para esta série. Tente novamente mais tarde ou escolha outro título.</div>';
      mostrarFeedbackPlayer("Série sem episódios", "Este título não possui episódios disponíveis para reprodução.", false, "📭");
      return;
    }

    const primeiraTemporada = currentSeasons.find(function (temporada) {
      return obterEpisodiosTemporada(temporada.season_number).length > 0;
    }) || currentSeasons[0];

    const opcoes = currentSeasons.map(function (temporada) {
      return '<option value="' + esc(temporada.season_number) + '">' + esc(temporada.name) + "</option>";
    }).join("");

    area.innerHTML =
      '<div class="serie-toolbar">' +
        '<h2>Episódios</h2>' +
        '<div class="season-picker">' +
          '<label for="seletorTemporada">Temporada</label>' +
          '<select id="seletorTemporada" class="season-select" onchange="mudarTemporada(this.value)">' + opcoes + '</select>' +
        '</div>' +
      '</div>' +
      '<div id="episodesGrid" class="episodes-grid"></div>';

    const seletor = $("#seletorTemporada");
    if (seletor && primeiraTemporada) seletor.value = String(primeiraTemporada.season_number);
    if (primeiraTemporada) {
      renderizarEpisodios(primeiraTemporada.season_number);
      reproduzirEpisodio(primeiraTemporada.season_number, 0, false);
    }
  } catch (erro) {
    if (!area || !document.body.contains(area) || String(currentSerieId) !== String(serieId)) return;
    area.innerHTML =
      '<div class="serie-message"><strong>Não foi possível carregar a série</strong>' +
      'Ocorreu um erro ao buscar os episódios. Verifique sua conexão e tente novamente.' +
      '<br><button class="retry-serie" type="button">Tentar novamente</button></div>';
    const tentar = area.querySelector(".retry-serie");
    if (tentar) {
      tentar.addEventListener("click", function () {
        area.innerHTML = '<div class="loading-inline"><span class="spinner"></span>Carregando episódios...</div>';
        carregarSerieDetalhes(item);
      });
    }
    mostrarFeedbackPlayer("Série indisponível", "Não foi possível carregar os episódios desta série.", false, "⚠️");
  }
}

/* ---------- Sessao / inicializacao ---------- */
function logout() {
  fecharMenu();
  limparIntervaloSlideshow();
  cancelarCliquePendente();
  clearTimeout(searchDebounce);
  searchDebounce = null;
  pararVideoAtual();
  buscaAtiva = false;

  try { localStorage.clear(); } catch (erro) {}
  favoritosCache = null;

  todosFilmes = [];
  todosSeries = [];
  todosCanais = [];
  categoriasFilmes = [];
  categoriasSeries = [];
  categoriasCanais = [];
  activeServerUrl = "";
  activeUser = "";
  activePass = "";
  streamBaseFilmes = "";
  streamBaseSeries = "";
  streamBaseCanais = "";
  currentItem = null;
  currentTipo = "";
  currentStreamUrl = "";
  currentSerieId = null;
  currentSerieName = "";
  currentEpisodesData = {};
  currentSeasons = [];
  currentEpisode = null;
  slideshowItems = [];

  const home = $("#homeView");
  const dinamica = $("#dynamicView");
  const slideshow = $("#slideshow");
  if (home) home.classList.remove("hidden");
  if (dinamica) {
    dinamica.innerHTML = "";
    dinamica.classList.add("hidden");
  }
  if (slideshow) slideshow.classList.add("hidden");
  const busca = $("#buscaGlobal");
  if (busca) busca.value = "";
  const app = $("#appScreen");
  const telaLogin = $("#loginScreen");
  if (app) app.classList.add("hidden");
  if (telaLogin) telaLogin.classList.remove("hidden");

  ["urlServidor", "usuario", "senha"].forEach(function (id) {
    const campo = document.getElementById(id);
    if (campo) campo.value = "";
  });
  const lembrar = $("#lembrarLogin");
  if (lembrar) lembrar.checked = false;
  const botao = $("#btnEntrar");
  if (botao) {
    botao.disabled = false;
    botao.textContent = "Entrar";
  }
  document.title = "HMS-TV — IPTV e Vida";
  window.scrollTo({ top: 0, behavior: "auto" });
  if (document.fullscreenElement && document.exitFullscreen) {
    try {
      const saida = document.exitFullscreen();
      if (saida && typeof saida.catch === "function") saida.catch(function () {});
    } catch (erro) {}
  }
  const url = $("#urlServidor");
  if (url) setTimeout(function () { url.focus(); }, 60);
}

function inicializar() {
  const form = $("#loginForm");
  if (form) form.addEventListener("submit", entrar);
  preencherLoginSalvo();
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") fecharMenu();
  });
  window.addEventListener("storage", function (event) {
    if (event.key === "favoritos" || event.key === null) favoritosCache = null;
  });
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", inicializar);
} else {
  inicializar();
}
</script>
